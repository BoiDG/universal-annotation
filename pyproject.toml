[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-scratchpad"
version = "0.2.0"
description = "A floating Markdown prompt composer for Windows"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "pywin32>=308; sys_platform == 'win32'",
  "comtypes>=1.4.10,<2; sys_platform == 'win32'",
  "pynput>=1.7.7,<2",
  "pyperclip>=1.9,<2",
]

[project.gui-scripts]
prompt-scratchpad = "prompt_scratchpad.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_scratchpad = ["assets/*"]
